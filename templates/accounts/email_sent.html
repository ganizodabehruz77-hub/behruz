{% extends 'base.html' %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h3 class="text-success fw-bold">Письмо отправлено!</h3>
            <p class="mt-3">Мы отправили ссылку для активации аккаунта на <strong>{{ email }}</strong>.</p>
            <p class="text-muted small">Перейдите по ссылке в письме, чтобы завершить регистрацию.</p>
            <a href="{% url 'login' %}" class="btn btn-outline-success mt-2">Перейти ко входу</a>
        </div>
    </div>
</div>
{% endblock %}
