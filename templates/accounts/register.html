{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-3 text-success fw-bold">Регистрация</h3>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Логин *</label>
                        <input type="text" name="username" class="form-control" required placeholder="Введите логин">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email (для активации) *</label>
                        <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Телефон для связи</label>
                        <input type="text" name="phone" class="form-control" placeholder="+7 999 123-45-67">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Пароль *</label>
                        <input type="password" name="password1" class="form-control" required placeholder="Пароль">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Повтор пароля *</label>
                        <input type="password" name="password2" class="form-control" required placeholder="Повторите пароль">
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_business" id="is_business">
                        <label class="form-check-label" for="is_business">
                            Я заведение / организация (пекарня, кафе)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Зарегистрироваться</button>
                </form>

                <div class="text-center mt-3 small">
                    Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
